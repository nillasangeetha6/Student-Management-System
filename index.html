<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>🎓 Student Management System</h1>
            <p>Manage Your Student Records Easily</p>
        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Active Students</h3>
                <h2 id="activeStudents">0</h2>
            </div>

        </section>

        <section class="form-section">

            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">

                <input type="hidden" id="editIndex">

                <div class="form-grid">

                    <input type="text" id="name"
                        placeholder="Student Name" required>

                    <input type="text" id="roll"
                        placeholder="Roll Number" required>

                    <input type="email" id="email"
                        placeholder="Email Address" required>

                    <input type="text" id="course"
                        placeholder="Course" required>

                    <input type="number" id="marks"
                        placeholder="Marks (0-100)"
                        min="0" max="100" required>

                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>

                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button type="button" id="cancelBtn" hidden>
                    Cancel
                </button>

            </form>

        </section>

        <section class="table-section">

            <div class="table-header">

                <h2>Student Records</h2>

                <input type="text" id="search"
                    placeholder="Search Students...">

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Marks</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">

                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>© 2026 Student Management System</p>
            <p>Developed using HTML, CSS & JavaScript</p>
        </footer>

    </div>

</body>
</html>
